[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "satellite-orbit-sim"
version = "0.1.0"
description = "Validated LEO orbit propagation, rendering, and telemetry streaming"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "brahe>=1.7,<2",
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "torch>=2,<3",
  "websockets>=15,<16",
]

[project.optional-dependencies]
legacy = ["pymsis>=0.10,<1"]
render = ["moderngl>=5.8,<6", "Pillow>=10,<13"]
viewer = ["opencv-python>=4.8,<5", "Pillow>=10,<13"]
rl = ["gymnasium>=0.29,<2"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]
all = [
  "gymnasium>=0.29,<2",
  "moderngl>=5.8,<6",
  "opencv-python>=4.8,<5",
  "Pillow>=10,<13",
  "pymsis>=0.10,<1",
]

[project.scripts]
satellite-orbit-sim = "main:main"
satellite-orbit-viewer = "stream.viewer_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "env", "render", "stream"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"config" = "config"
"assets" = "assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["validation/orekit/target"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"validation/**/*.py" = ["E402"]

[dependency-groups]
dev = [
    "aiortc>=1.13,<2",
]
