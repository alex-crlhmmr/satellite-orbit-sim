name: Dynamics validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/**"
      - "validation/**"
      - "requirements*.txt"
      - ".github/workflows/dynamics-validation.yml"

jobs:
  orekit-cross-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/orbit-validation-tools
            /tmp/sentinel1-pod
            /tmp/swarm-pod
            /tmp/gracefo-density
          key: orbit-validation-v1-${{ runner.os }}-${{ runner.arch }}
      - run: python -m pip install -r requirements-dev.txt
      - run: validation/bootstrap.sh /tmp/orbit-validation-tools
      - run: python -m pytest -q
      - name: Orekit/Brahe quick matrix
        run: |
          python validation/run.py --quick \
            --java /tmp/orbit-validation-tools/jdk-21.0.12+8/bin/java \
            --orekit-jar validation/orekit/target/orekit-reference-1.0.0.jar \
            --orekit-data /tmp/orbit-validation-tools/orekit-data-baf158744d38ec76cf94e2d396280d545b9f0ba2 \
            --gravity-file /tmp/orbit-validation-tools/EGM2008.gfc \
            --output /tmp/quick-validation
          python -c 'import json; assert json.load(open("/tmp/quick-validation/results.json"))["passed"]'
      - uses: actions/upload-artifact@v4
        with:
          name: quick-validation-report
          path: /tmp/quick-validation
      - name: Real Sentinel-1A evidence gate
        run: |
          python validation/real_data/fetch.py /tmp/sentinel1-pod
          python validation/real_data/benchmark.py \
            --data /tmp/sentinel1-pod \
            --output /tmp/real-data-validation
          python -c 'import json; assert json.load(open("/tmp/real-data-validation/results.json"))["passed"]'
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-validation-report
          path: /tmp/real-data-validation
      - name: Real Swarm-A evidence gate
        run: |
          python validation/real_data/fetch.py /tmp/swarm-pod \
            --manifest validation/real_data/swarm_manifest.yaml
          python validation/real_data/benchmark.py \
            --data /tmp/swarm-pod \
            --manifest validation/real_data/swarm_manifest.yaml \
            --protocol validation/real_data/swarm_protocol.yaml \
            --output /tmp/swarm-validation
          python -c 'import json; assert json.load(open("/tmp/swarm-validation/results.json"))["passed"]'
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-validation-report
          path: /tmp/swarm-validation
      - name: Frozen Swarm atmosphere comparison
        run: |
          python validation/real_data/compare_atmospheres.py \
            --data /tmp/swarm-pod \
            --manifest validation/real_data/swarm_manifest.yaml \
            --protocol validation/real_data/swarm_protocol.yaml \
            --output /tmp/swarm-atmospheres
          python -c 'import json; d=json.load(open("/tmp/swarm-atmospheres/comparison.json")); r={x["model"]:x for x in d["models"]}; assert all(r["nrlmsise00"][k] == min(x[k] for x in r.values()) for k in ("fitted_validation_mean_rms_m", "fitted_test_mean_rms_m"))'
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-atmosphere-comparison
          path: /tmp/swarm-atmospheres
      - name: Frozen Sentinel atmosphere comparison
        run: |
          python validation/real_data/compare_atmospheres.py \
            --data /tmp/sentinel1-pod \
            --manifest validation/real_data/manifest.yaml \
            --protocol validation/real_data/protocol.yaml \
            --output /tmp/sentinel-atmospheres
          python -c 'import json; d=json.load(open("/tmp/sentinel-atmospheres/comparison.json")); r={x["model"]:x for x in d["models"]}; assert r["nrlmsise00"]["passed"] and not r["exponential"]["passed"] and not r["harris_priester"]["passed"]; assert r["nrlmsise00"]["fitted_test_mean_rms_m"] == min(x["fitted_test_mean_rms_m"] for x in r.values())'
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-atmosphere-comparison
          path: /tmp/sentinel-atmospheres
      - name: GRACE-FO force-level density gate
        run: |
          python validation/density/fetch.py /tmp/gracefo-density
          python validation/density/benchmark.py \
            --data /tmp/gracefo-density \
            --output /tmp/gracefo-density-validation
          python -c 'import json; d=json.load(open("/tmp/gracefo-density-validation/results.json")); assert d["passed"]'
      - uses: actions/upload-artifact@v4
        with:
          name: gracefo-density-validation
          path: /tmp/gracefo-density-validation
