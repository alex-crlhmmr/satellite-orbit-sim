# Twenty-spacecraft Walker-style LEO visualization scenario.
# Four orbital planes contain five evenly spaced spacecraft each. Values
# inherit from config/default.yaml unless overridden here.

environment:
  env_dt: 5.0
  max_steps: 0

render:
  camera_mode: fixed
  camera_target: plane-01-sat-01
  # Twenty independent high-fidelity propagators sustain about 10 Hz on Jetson.
  fps: 10
  trail_length: 900

stream:
  video_port: 9110
  telemetry_port: 9111
  http_port: 8084
  jpeg_quality: 75
  webrtc_enabled: true
  webrtc_port: 8085
  webrtc_bitrate: 500000

satellites:
  - id: plane-01-sat-01
    orbit: {semi_major_axis_m: 6928137.0, eccentricity: 0.0005, inclination_deg: 53.0, raan_deg: 0.0, arg_periapsis_deg: 0.0, true_anomaly_deg: 0.0}
