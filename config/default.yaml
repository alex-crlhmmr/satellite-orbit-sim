# Orbital Simulation Configuration

# Initial orbit (Keplerian elements)
orbit:
  semi_major_axis_m: 6778137.0    # ~400 km altitude (ISS-like)
  eccentricity: 0.0001
  inclination_deg: 51.6
  raan_deg: 0.0
  arg_periapsis_deg: 0.0
  true_anomaly_deg: 0.0

# Satellite properties
satellite:
  mass_kg: 100.0
  drag_coefficient: 2.2
  reflectivity_coefficient: 1.5
  area_to_mass_ratio: 0.01        # m²/kg
  drag_area_m2: 1.0               # independent projected drag area
  srp_area_m2: 1.0                # independent illuminated SRP area
  max_thrust_n: 0.1               # Maximum thrust per axis [N]

# Propagator settings
propagator:
  backend: high_fidelity          # validated Brahe dynamics; 'legacy' is the fast educational model
  dt: 10.0                        # output/command interval [s]
  high_fidelity:
    gravity_degree: 20            # EGM2008 degree/order
    gravity_order: 20
    enable_tides: true            # IERS solid Earth + pole tide
    enable_relativity: true
    abs_tol: 1.0e-6               # adaptive RKF78 tolerances
    rel_tol: 1.0e-11
    max_step: 60.0
    # Continuous white-acceleration PSD in RTN [m²/s³]. Zero until calibrated
    # against representative tracking residuals; never invent confidence.
    process_noise_acceleration_psd_rtn: [0.0, 0.0, 0.0]
    enable_drag: true
    enable_srp: true
    enable_third_body: true
  legacy:
    enable_j2: true
    max_j_degree: 6               # J2 through J6
    enable_drag: true
    enable_srp: true
    enable_third_body: true
    # Optional first-order attitude-aware drag geometry. When enabled, the
    # legacy constant area_mass is replaced by projected area / mass at every
    # force evaluation, assuming +X along-track / +Z nadir LVLH attitude.
    # drag_geometry:
    #   box_dimensions_m: [1.0, 1.0, 1.0]
    #   panels:
    #     - {normal_body: [0.0, 0.0, 1.0], area_m2: 2.0}
    # drag_attitude: lvlh           # or fixed_quaternion
    # attitude_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

# Atmosphere model used only by the legacy backend. The high-fidelity backend
# uses Brahe NRLMSISE-00 with measured space weather.
atmosphere:
  model: nrlmsise2                # 'nrlmsise2' (MSIS 2.x via pymsis) or 'ussa76' (legacy)
  f107: 150.0                     # daily 10.7cm solar radio flux [sfu] (typical 70-300)
  f107a: 150.0                    # 81-day-centred average F10.7 [sfu]
  ap: 4.0                         # geomagnetic Ap index (quiet ~4, storm 50+)
  # wind_ecef_mps: [0.0, 0.0, 0.0]  # optional specified neutral-wind sensitivity input
  # For reproducible storm reconstruction, supply a daily CSV with columns
  # date,f107,f107a,ap plus its immutable checksum. Missing/stale dates fail.
  # space_weather_file: validation/data/space_weather.csv
  # space_weather_sha256: <64 lowercase hex characters>
  # space_weather_max_age_days: 1

# Epoch (J2000 + offset)
epoch:
  year: 2024
  month: 3
  day: 20
  hour: 12
  minute: 0
  second: 0

# Environment settings
environment:
  env_dt: 60.0                    # Time per env.step() [s]
  max_steps: 1440                 # 1440 * 60s = 1 day
  reward_type: station_keeping    # station_keeping, orbit_raising, deorbit
  fuel_penalty: 0.1
  deorbit_target_altitude_km: 120.0

# Rendering settings
render:
  enabled: true
  width: 1280
  height: 720
  fps: 30
  trail_length: 500               # Number of trail points to keep
  earth_day_texture: assets/earth_day.jpg
  earth_night_texture: assets/earth_night.jpg
  camera_mode: tracking           # 'tracking' (follows sat) or 'fixed' (inertial overview)

# Streaming settings
stream:
  enabled: true
  bind_host: 0.0.0.0              # Exposes streams to the LAN; use 127.0.0.1 with SSH tunnels
  video_port: 9100                # binary TCP video (optional packaged viewer)
  telemetry_port: 9101            # binary TCP telemetry (optional packaged viewer)
  http_port: 8080                 # browser viewer: http://localhost:8080
  jpeg_quality: 85
