# Twenty-five-spacecraft near-polar Walker-style LEO scenario.
# Five planes, separated by 36 degrees in RAAN (the other 180 degrees describe
# the same plane), each contain five evenly phased spacecraft. The 97.4-degree
# constellation provides global ground-track access over time. Plane 1 is
# exactly polar; the other four are 97.4-degree near-polar planes.

environment:
  env_dt: 5.0
  max_steps: 0

render:
  camera_mode: fixed
  camera_target: plane-01-sat-01
  # Measured sustainable cadence for 25 independent high-fidelity propagators.
  fps: 8
  trail_length: 900

stream:
  video_port: 9110
  telemetry_port: 9111
  http_port: 8084
  jpeg_quality: 75
  webrtc_enabled: true
  webrtc_port: 8085
  webrtc_bitrate: 400000

satellites:
  - {id: plane-01-sat-01, orbit: {semi_major_axis_m: 7078137.0, eccentricity: 0.0005, inclination_deg: 90.0, raan_deg: 0.0, arg_periapsis_deg: 0.0, true_anomaly_deg: 0.0}}
